<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HoistRef">
<title>HoistRef — STAHL ST</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"HoistRef","short_name":"HoistRef","start_url":".","display":"standalone","background_color":"%230a0a0a","theme_color":"%230a0a0a"}'>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #161616;
    --bg-hi: #1f1f1f;
    --border: #2a2a2a;
    --border-hi: #3a3a3a;
    --text: #f0f0f0;
    --text-dim: #a0a0a0;
    --text-muted: #606060;
    --accent: #ffb000;
    --accent-dim: #7a5300;
    --danger: #ff3b30;
    --success: #30d158;
    --pass: #30d158;
    --fail: #ff3b30;
    --na: #606060;
    --mono: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 16px; line-height: 1.45;
    min-height: 100vh; overscroll-behavior-y: contain;
  }

  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 12px;
    display: flex; align-items: center; gap: 12px;
  }

  .brand {
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
    white-space: nowrap;
  }
  .brand::before { content: "▮ "; color: var(--accent); }

  .breadcrumb {
    flex: 1; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .breadcrumb strong { color: var(--text-dim); font-weight: 500; }

  .back-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    padding: 6px 10px; border-radius: 2px; cursor: pointer;
  }
  .back-btn:active { background: var(--bg-hi); }
  .back-btn::before { content: "← "; }

  main { padding: 20px 16px 80px; max-width: 900px; margin: 0 auto; }

  .screen { animation: fadeIn 0.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .step-label {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 0 6px 0;
  }

  .step-heading {
    font-size: 24px; font-weight: 700; letter-spacing: -0.01em;
    margin: 0 0 16px 0; color: var(--text);
  }

  .step-sub {
    font-size: 14px; color: var(--text-dim);
    margin: -8px 0 24px 0;
  }

  .select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .select-grid { grid-template-columns: 1fr; } }

  .select-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px 16px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    transition: all 0.1s;
    width: 100%;
    display: block;
  }

  .select-card:active {
    background: var(--bg-hi);
    border-color: var(--accent);
  }

  .select-card.wide { grid-column: span 2; }
  @media (max-width: 380px) { .select-card.wide { grid-column: span 1; } }

  .sc-code {
    font-family: var(--mono); font-size: 18px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.03em;
    display: block; margin-bottom: 6px;
  }

  .sc-range {
    font-family: var(--mono); font-size: 13px;
    color: var(--text-dim);
    display: block; margin-bottom: 4px;
  }

  .sc-detail {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .service-card {
    padding: 22px 20px;
    margin-bottom: 10px;
  }
  .service-card .sc-code { font-size: 20px; margin-bottom: 8px; }
  .service-card .sc-detail { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  .job-summary {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-bottom: 20px;
    border-left: 3px solid var(--accent);
  }

  .js-row {
    display: flex; justify-content: space-between;
    align-items: baseline; gap: 12px;
    padding: 4px 0;
    font-size: 13px;
  }

  .js-row + .js-row { border-top: 1px dotted var(--border); margin-top: 4px; padding-top: 8px; }

  .js-label {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted);
  }

  .js-value {
    font-family: var(--mono); font-weight: 600;
    color: var(--text); text-align: right;
  }

  .progress {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; color: var(--text-muted);
  }
  .progress-bar {
    flex: 1; height: 3px; background: var(--bg-hi);
    position: relative; overflow: hidden; border-radius: 2px;
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--accent); transition: width 0.2s ease-out;
  }

  .check-group {
    margin-bottom: 28px;
  }

  .check-group-title {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px 0;
    padding: 0 4px;
  }

  .check-item {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 8px;
    transition: all 0.15s;
  }

  .check-item.done-pass { border-left: 3px solid var(--pass); }
  .check-item.done-fail { border-left: 3px solid var(--fail); }
  .check-item.done-na { border-left: 3px solid var(--na); }

  .ci-main {
    padding: 14px 14px 10px;
    display: flex; gap: 12px; align-items: flex-start;
  }

  .ci-num {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    color: var(--accent); background: var(--bg-hi);
    padding: 3px 6px; border-radius: 2px;
    letter-spacing: 0.05em; flex-shrink: 0;
    min-width: 26px; text-align: center;
  }

  .ci-body { flex: 1; min-width: 0; }

  .ci-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    line-height: 1.3; margin-bottom: 4px;
  }

  .ci-value {
    font-family: var(--mono); font-size: 12px;
    color: var(--accent); margin-top: 6px;
    background: rgba(255, 176, 0, 0.08);
    padding: 5px 8px; border-radius: 2px;
    border-left: 2px solid var(--accent-dim);
    line-height: 1.45;
    word-wrap: break-word;
  }

  .ci-note {
    font-size: 12px; color: var(--text-dim);
    margin-top: 6px; line-height: 1.45;
  }

  .ci-expand-btn {
    background: none; border: none;
    color: var(--text-muted);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 0 0 0; cursor: pointer;
    display: inline-block;
  }
  .ci-expand-btn:active { color: var(--accent); }

  .ci-expand {
    display: none;
    padding: 0 14px 12px 14px;
    font-size: 13px; color: var(--text-dim);
    line-height: 1.55;
    border-top: 1px dotted var(--border);
    padding-top: 12px;
    margin-top: 4px;
  }
  .ci-expand.open { display: block; }
  .ci-expand ol, .ci-expand ul { padding-left: 18px; margin: 4px 0; }
  .ci-expand li { margin-bottom: 4px; }
  .ci-expand strong { color: var(--text); }

  /* ─── DIAGRAMS ─── */
  .diagram {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 14px;
    margin: 10px 0;
    text-align: center;
  }
  .diagram svg {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .diagram-caption {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Inline diagram link button */
  .ci-diagram-btn {
    background: rgba(255, 176, 0, 0.08);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 2px;
    cursor: pointer;
    margin: 8px 8px 0 0;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ci-diagram-btn:active { background: rgba(255, 176, 0, 0.15); }
  .ci-diagram-btn svg { width: 12px; height: 12px; }

  /* Diagram modal/overlay */
  .dgm-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.15s ease-out;
  }
  .dgm-overlay.open { display: flex; }
  .dgm-panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-hi);
    border-radius: 2px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px 18px;
  }
  .dgm-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px 0;
  }
  .dgm-subtitle {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .dgm-close {
    position: sticky; top: 0;
    float: right;
    background: var(--bg-hi);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 8px;
  }
  .dgm-body {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-dim);
  }
  .dgm-body strong { color: var(--text); }
  .dgm-body ul, .dgm-body ol { padding-left: 18px; margin: 8px 0; }
  .dgm-body li { margin-bottom: 4px; }

  /* SVG diagram styling classes */
  .svg-part { fill: none; stroke: var(--text); stroke-width: 1.4; stroke-linejoin: round; }
  .svg-part-fill { fill: #1a1a1a; stroke: var(--text); stroke-width: 1.4; stroke-linejoin: round; }
  .svg-hidden { fill: none; stroke: var(--text-dim); stroke-width: 1; stroke-dasharray: 4 3; }
  .svg-centerline { fill: none; stroke: var(--text-muted); stroke-width: 0.8; stroke-dasharray: 8 2 2 2; }
  .svg-measure { stroke: var(--accent); stroke-width: 1; fill: none; }
  .svg-measure-end { fill: var(--accent); stroke: none; }
  .svg-ext { stroke: var(--accent); stroke-width: 0.8; fill: none; }
  .svg-label { fill: var(--accent); font-family: var(--mono); font-size: 11px; font-weight: 600; }
  .svg-label-bg { fill: #0d0d0d; }
  .svg-label-dim { fill: var(--text-dim); font-family: var(--mono); font-size: 10px; }
  .svg-label-part { fill: var(--text); font-family: var(--mono); font-size: 10px; font-weight: 700; }
  .svg-leader { stroke: var(--text-dim); stroke-width: 0.8; fill: none; }
  .svg-callout-circle { fill: #0d0d0d; stroke: var(--text); stroke-width: 1; }
  .svg-warn { fill: var(--danger); }
  .svg-warn-line { stroke: var(--danger); stroke-width: 1.2; fill: none; }
  .svg-ok { fill: var(--success); }
  .svg-ok-line { stroke: var(--success); stroke-width: 1.2; fill: none; }

  .ci-actions {
    display: flex; gap: 6px;
    padding: 0 14px 12px 14px;
  }

  .ci-btn {
    flex: 1;
    background: var(--bg-hi);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 11px 6px; border-radius: 2px; cursor: pointer;
    transition: all 0.1s;
    min-height: 40px;
  }
  .ci-btn:active { transform: scale(0.97); }

  .check-item.done-pass .ci-btn.pass { background: var(--pass); color: #000; border-color: var(--pass); }
  .check-item.done-fail .ci-btn.fail { background: var(--fail); color: #fff; border-color: var(--fail); }
  .check-item.done-na   .ci-btn.na   { background: var(--na);   color: #fff; border-color: var(--na); }

  .ci-notes-input {
    display: block; width: calc(100% - 28px);
    margin: 0 14px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono); font-size: 12px;
    padding: 8px 10px; border-radius: 2px;
    outline: none; resize: vertical;
    min-height: 34px;
  }
  .ci-notes-input:focus { border-color: var(--accent); }
  .ci-notes-input::placeholder { color: var(--text-muted); font-size: 11px; letter-spacing: 0.04em; }

  .bottom-actions {
    margin-top: 30px;
    display: grid; gap: 8px;
  }

  .action-btn {
    padding: 14px; background: var(--bg-elev);
    border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 2px; cursor: pointer;
    text-align: center;
  }
  .action-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .action-btn.danger  { background: transparent; color: var(--danger); border-color: var(--danger); }
  .action-btn:active  { transform: scale(0.99); }

  .callout {
    border-left: 3px solid var(--accent);
    background: rgba(255, 176, 0, 0.05);
    padding: 12px 14px;
    margin: 0 0 16px 0;
    font-size: 13px; line-height: 1.5;
  }
  .callout.danger { border-left-color: var(--danger); background: rgba(255, 59, 48, 0.07); }

  .callout-label {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); display: block; margin-bottom: 4px;
  }
  .callout.danger .callout-label { color: var(--danger); }

  .field-row { margin-bottom: 16px; }
  .field-label {
    display: block; font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field-input {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono); font-size: 14px;
    padding: 12px 14px; border-radius: 2px;
    outline: none;
  }
  .field-input:focus { border-color: var(--accent); }

  .summary-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 24px;
  }

  .stat-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 14px; border-radius: 2px;
    text-align: center;
  }
  .stat-card.pass { border-color: var(--pass); }
  .stat-card.fail { border-color: var(--fail); }

  .stat-num {
    font-family: var(--mono); font-size: 28px; font-weight: 700;
    display: block; line-height: 1;
  }
  .stat-card.pass .stat-num { color: var(--pass); }
  .stat-card.fail .stat-num { color: var(--fail); }

  .stat-label {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin-top: 6px; display: block;
  }
</style>
</head>
<body>

<header>
  <div class="brand">HoistRef</div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <button class="back-btn" id="backBtn" style="display:none">BACK</button>
</header>

<main id="main"></main>

<!-- Diagram overlay -->
<div class="dgm-overlay" id="dgmOverlay">
  <div class="dgm-panel" id="dgmPanel">
    <button class="dgm-close" id="dgmClose">×</button>
    <h2 class="dgm-title" id="dgmTitle"></h2>
    <p class="dgm-subtitle" id="dgmSubtitle"></p>
    <div id="dgmContent"></div>
    <div class="dgm-body" id="dgmBody"></div>
  </div>
</div>

<script>
const MODEL_META = {
  ST05: { range: '125 – 630 kg',   chainSize: '4 × 12 mm' },
  ST10: { range: '500 – 1,000 kg', chainSize: '5 × 16 mm' },
  ST20: { range: '1,000 – 2,000 kg', chainSize: '7 × 21.9 mm' },
  ST30: { range: '1,250 – 3,200 kg', chainSize: '9 × 27 mm' },
  ST32: { range: '1,250 – 3,200 kg', chainSize: '9 × 27 mm' },
  ST50: { range: '2,500 – 5,000 kg', chainSize: '11.3 × 31 mm' },
  ST60: { range: '3,200 – 6,300 kg', chainSize: '11.3 × 31 mm' },
};

const VARIANTS = {
  ST05: [
    { code: 'ST 0501-8',  swl: '125 kg @ 3m',   reeving: '1/1', speed: '8 m/min' },
    { code: 'ST 0501-16', swl: '125 kg @ 2m',   reeving: '1/1', speed: '16 m/min' },
    { code: 'ST 0502-8',  swl: '250 kg / 500 kg', reeving: '1/1 · 2/1', speed: '8 m/min' },
    { code: 'ST 0503-6',  swl: '320 kg / 630 kg', reeving: '1/1 · 2/1', speed: '6 m/min' },
  ],
  ST10: [
    { code: 'ST 1004-16', swl: '400 kg / 800 kg',  reeving: '1/1 · 2/1', speed: '16 m/min' },
    { code: 'ST 1005-..', swl: '500 kg / 1,000 kg', reeving: '1/1 · 2/1', speed: '8/12 m/min' },
  ],
  ST20: [
    { code: 'ST 2006-12', swl: '630 kg / 1,250 kg', reeving: '1/1 · 2/1', speed: '12 m/min' },
    { code: 'ST 2008-16', swl: '800 kg',           reeving: '1/1',       speed: '16 m/min' },
    { code: 'ST 2010-8',  swl: '1,000 kg / 2,000 kg', reeving: '1/1 · 2/1', speed: '8 m/min' },
    { code: 'ST 2010-12', swl: '1,000 kg / 2,000 kg', reeving: '1/1 · 2/1', speed: '12 m/min' },
  ],
  ST30: [
    { code: 'ST 3016-8',  swl: '1,600 kg / 3,200 kg', reeving: '1/1 · 2/1', speed: '8 m/min' },
  ],
  ST32: [
    { code: 'ST 3212-16', swl: '1,250 kg',           reeving: '1/1',       speed: '16 m/min' },
    { code: 'ST 3216-8',  swl: '1,600 kg / 3,200 kg', reeving: '1/1 · 2/1', speed: '8 m/min' },
    { code: 'ST 3216-12', swl: '1,600 kg / 3,200 kg', reeving: '1/1 · 2/1', speed: '12 m/min' },
  ],
  ST50: [
    { code: 'ST 5025-6',  swl: '2,500 kg / 5,000 kg', reeving: '1/1 · 2/1', speed: '6 m/min' },
    { code: 'ST 5025-8',  swl: '2,500 kg / 5,000 kg', reeving: '1/1 · 2/1', speed: '8 m/min' },
  ],
  ST60: [
    { code: 'ST 6032-6',  swl: '3,200 kg / 6,300 kg', reeving: '1/1 · 2/1', speed: '6 m/min' },
  ],
};

const CHAIN = {
  ST05: { size: '4 × 12',    partNo: '331 005 9', dMin: 3.6,  tMax: 12.5, t11Max: 134.4 },
  ST10: { size: '5 × 16',    partNo: '331 006 9', dMin: 4.5,  tMax: 16.8, t11Max: 179.66 },
  ST20: { size: '7 × 21.9',  partNo: '331 001 9', dMin: 6.3,  tMax: 23.0, t11Max: 245.92 },
  ST30: { size: '9 × 27',    partNo: '331 004 9', dMin: 8.1,  tMax: 28.3, t11Max: 303.18 },
  ST32: { size: '9 × 27',    partNo: '331 004 9', dMin: 8.1,  tMax: 28.3, t11Max: 303.18 },
  ST50: { size: '11.3 × 31', partNo: '331 013 9', dMin: 10.2, tMax: 32.5, t11Max: 350.37 },
  ST60: { size: '11.3 × 31', partNo: '331 023 9', dMin: 10.2, tMax: 32.5, t11Max: 350.37 },
};

    body: `

      <p><strong>Don't confuse tread wear with flange wear</strong> — they're different failures with different causes.</p>
      <p><strong>Wheel replacement at 5% diameter reduction:</strong></p>
      <ul>
        <li>Ø50 → replace at 48 mm (b min 17 mm)</li>
        <li>Ø63 → replace at 60 mm (b min 18.5 mm)</li>
        <li>Ø80 → replace at 76 mm (b min 29.5 mm)</li>
        <li>Ø100 → replace at 95 mm (b min 35 mm)</li>
        <li>Ø125 → replace at 119 mm (b min 40 mm)</li>

        <li>Guide rollers (if fitted) adjustment</li>
        <li>Flange play vs runway width</li>
        <li>Suspension bolt wear</li>
      </ul>
      <p>Fixing the cause is more important than just replacing the wheel — otherwise the new one wears the same way.</p>

        { id: 'electrical-connections', title: 'Electrical terminals re-torqued', note: 'Contactor and motor terminals. Check manufacturer spec.' },
        { id: 'brake-full-inspect', title: 'Brake air gap / displacement measured', valueFn: (m) => BRAKE[m].spec, note: '5-year service is natural point for brake overhaul if near limits.',
          diagram: (m) => m === 'ST05' ? 'brakeST05' : 'brakeST10plus' },
        { id: 'clutch-verified', title: 'Slipping clutch setting verified', note: '125% factory. Annual requirement anyway — tie in here.',

        { id: 'post-label', title: 'Service label / sticker applied', note: 'Date, engineer, next service due.' },

const MODELS = ['ST05','ST10','ST20','ST30','ST32','ST50','ST60'];

let state = {
  screen: 'model',
  model: null,
  variant: null,
  service: null,
  serial: '',
  siteRef: '',
  results: {},
};

(function restore() {
  const saved = localStorage.getItem('hr_session');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s && s.screen) state = { ...state, ...s };
    } catch {}
  }
})();

function save() {
  localStorage.setItem('hr_session', JSON.stringify(state));
}

function go(screen, opts = {}) {
  state.screen = screen;
  Object.assign(state, opts);
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function resetSession() {
  state = { screen: 'model', model: null, variant: null, service: null, serial: '', siteRef: '', results: {} };
  save();
  render();
}

function render() {
  const main = document.getElementById('main');
  const crumb = document.getElementById('breadcrumb');
  const back = document.getElementById('backBtn');

  const parts = [];
  if (state.model && state.screen !== 'model') parts.push(`<strong>${state.model}</strong>`);
  if (state.variant && (state.screen === 'service' || state.screen === 'job' || state.screen === 'checklist' || state.screen === 'summary')) parts.push(state.variant.code);
  if (state.service && (state.screen === 'checklist' || state.screen === 'summary')) parts.push(SERVICE_TYPES[state.service].label);
  crumb.innerHTML = parts.join(' <span style="opacity:0.5">/</span> ');

  back.style.display = state.screen === 'model' ? 'none' : 'inline-flex';

  const screens = {
    model: screenModel,
    variant: screenVariant,
    service: screenService,
    job: screenJob,
    checklist: screenChecklist,
    summary: screenSummary
  };
  main.innerHTML = (screens[state.screen] || screenModel)();
  attachHandlers();
}

function screenModel() {
  return `
    <div class="screen">
      <p class="step-label">Step 1 of 4</p>
      <h1 class="step-heading">Select hoist model</h1>
      <p class="step-sub">Pick the model you're servicing. Check the nameplate if unsure.</p>
      <div class="select-grid">
        ${MODELS.map(m => `
          <button class="select-card" data-model="${m}">
            <span class="sc-code">${m}</span>
            <span class="sc-range">${MODEL_META[m].range}</span>
            <span class="sc-detail">Chain: ${MODEL_META[m].chainSize}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function screenVariant() {
  const m = state.model;

    <div class="screen">
      <p class="step-label">Step 2 of 4</p>
      <h1 class="step-heading">${m} variant</h1>
      <p class="step-sub">From the hoist nameplate — full type designation tells you reeving and duty.</p>
      <div class="select-grid">
        ${variants.map((v, i) => `
          <button class="select-card wide" data-variant="${i}">
            <span class="sc-code">${v.code}</span>

          </button>

      </div>
    </div>
  `;
}

function screenService() {
  return `
    <div class="screen">
      <p class="step-label">Step 3 of 4</p>
      <h1 class="step-heading">Service type</h1>
      <p class="step-sub">Each service generates its own scoped checklist with ${state.model} values baked in.</p>

      <button class="select-card service-card wide" data-service="preventive">
        <span class="sc-code">Preventive Service</span>
        <span class="sc-range">3-monthly · ~45 min</span>

      </button>

      <button class="select-card service-card wide" data-service="loler">
        <span class="sc-code">LOLER Thorough Examination</span>
        <span class="sc-range">Annual · ~90 min</span>
        <span class="sc-detail">Competent person inspection under LOLER 98 Reg 9. Documented report. ${countItems('loler')} items.</span>
      </button>

      <button class="select-card service-card wide" data-service="oilchange">
        <span class="sc-code">Oil Change / 5-Year Service</span>
        <span class="sc-range">5-yearly · ~60 min</span>
        <span class="sc-detail">Gear oil change + deep service touching all major systems. ${countItems('oilchange')} items.</span>
      </button>
    </div>
  `;
}

function screenJob() {
  return `
    <div class="screen">
      <p class="step-label">Step 4 of 4</p>
      <h1 class="step-heading">Job details</h1>
      <p class="step-sub">Optional — for your records. Skip if you don't need these.</p>

      <div class="field-row">
        <label class="field-label">Hoist serial number</label>
        <input class="field-input" id="serialInput" type="text" value="${state.serial}" placeholder="From nameplate" autocapitalize="characters" autocomplete="off">
      </div>

      <div class="field-row">
        <label class="field-label">Site / location ref</label>
        <input class="field-input" id="siteInput" type="text" value="${state.siteRef}" placeholder="Customer / location / asset ID" autocomplete="off">
      </div>

      <div class="bottom-actions">
        <button class="action-btn primary" id="startBtn">Start Checklist →</button>
      </div>
    </div>
  `;

function screenChecklist() {
  const m = state.model;
  const service = SERVICE_TYPES[state.service];
  const totalItems = service.groups.reduce((a, g) => a + g.items.length, 0);
  const doneItems = Object.values(state.results).filter(r => r && r.status).length;
  const pct = Math.round((doneItems / totalItems) * 100);

  return `
    <div class="screen">
      <div class="job-summary">
        <div class="js-row">
          <span class="js-label">Hoist</span>
          <span class="js-value">${m} · ${state.variant.code}</span>
        </div>
        <div class="js-row">
          <span class="js-label">SWL</span>
          <span class="js-value">${state.variant.swl}</span>
        </div>
        ${state.serial ? `<div class="js-row"><span class="js-label">Serial</span><span class="js-value">${escapeHtml(state.serial)}</span></div>` : ''}
        ${state.siteRef ? `<div class="js-row"><span class="js-label">Site</span><span class="js-value">${escapeHtml(state.siteRef)}</span></div>` : ''}
        <div class="js-row">
          <span class="js-label">Service</span>
          <span class="js-value">${service.label}</span>
        </div>
      </div>

      <div class="progress">
        <span>${doneItems}/${totalItems}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
      </div>

      ${service.groups.map(group => `
        <div class="check-group">
          <h3 class="check-group-title">${group.title}</h3>
          ${group.items.map((item, i) => renderItem(item, i, m)).join('')}
        </div>
      `).join('')}

      <div class="bottom-actions">
        <button class="action-btn primary" id="finishBtn">Finish &amp; Summary →</button>
        <button class="action-btn danger" id="resetBtn">Clear All Results</button>
      </div>
    </div>
  `;
}

function resolveContent(c, m) {
  if (typeof c === 'function') return c(m);
  return c;
}

function renderItem(item, i, m) {
  const result = state.results[item.id] || {};
  const status = result.status || null;
  const cls = status ? `done-${status}` : '';

  const value = item.valueFn ? resolveContent(item.valueFn, m) : '';
  const note = item.note ? resolveContent(item.note, m) : '';
  const expand = item.expand ? resolveContent(item.expand, m) : '';

  /* Resolve diagram key - may be a string or a function of model */
  let diagramKey = null;
  if (item.diagram) {
    diagramKey = typeof item.diagram === 'function' ? item.diagram(m) : item.diagram;
  }

  const num = String(i + 1).padStart(2, '0');
  const expandId = `exp-${item.id}`;

  return `
    <div class="check-item ${cls}" data-item="${item.id}">
      <div class="ci-main">
        <span class="ci-num">${num}</span>
        <div class="ci-body">
          <div class="ci-title">${item.title}</div>
          ${value ? `<div class="ci-value">${value}</div>` : ''}
          ${note ? `<div class="ci-note">${note}</div>` : ''}
          ${diagramKey ? `
            <button class="ci-diagram-btn" data-diagram="${diagramKey}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
              ${DIAGRAM_LABELS[diagramKey] || 'Diagram'}
            </button>
          ` : ''}
          ${expand ? `<button class="ci-expand-btn" data-expand="${expandId}">+ Details</button>` : ''}
        </div>
      </div>
      ${expand ? `<div class="ci-expand" id="${expandId}">${expand}</div>` : ''}
      <div class="ci-actions">
        <button class="ci-btn pass" data-mark="pass" data-id="${item.id}">Pass</button>
        <button class="ci-btn fail" data-mark="fail" data-id="${item.id}">Fail</button>
        <button class="ci-btn na"   data-mark="na"   data-id="${item.id}">N/A</button>
      </div>
      <textarea class="ci-notes-input" data-note="${item.id}" placeholder="Measured value(s), observations, photo ref, defect description...">${escapeHtml(result.note || '')}</textarea>
    </div>
  `;
}

function screenSummary() {
  const m = state.model;
  const service = SERVICE_TYPES[state.service];
  const totalItems = service.groups.reduce((a, g) => a + g.items.length, 0);

  const counts = { pass: 0, fail: 0, na: 0, pending: 0 };
  service.groups.forEach(g => {
    g.items.forEach(item => {
      const r = state.results[item.id];
      if (!r || !r.status) counts.pending++;
      else counts[r.status]++;
    });
  });

  const fails = [];
  service.groups.forEach(g => {
    g.items.forEach(item => {
      const r = state.results[item.id];
      if (r && r.status === 'fail') fails.push({ item, note: r.note, group: g.title });
    });
  });

  const date = new Date().toLocaleString('en-GB');

  return `
    <div class="screen">
      <p class="step-label">Service Summary</p>
      <h1 class="step-heading">${m} / ${state.variant.code}</h1>
      <p class="step-sub">${service.label} · ${date}</p>

      <div class="job-summary">
        ${state.serial ? `<div class="js-row"><span class="js-label">Serial</span><span class="js-value">${escapeHtml(state.serial)}</span></div>` : ''}
        ${state.siteRef ? `<div class="js-row"><span class="js-label">Site</span><span class="js-value">${escapeHtml(state.siteRef)}</span></div>` : ''}
        <div class="js-row"><span class="js-label">SWL</span><span class="js-value">${state.variant.swl}</span></div>
        <div class="js-row"><span class="js-label">Total items</span><span class="js-value">${totalItems}</span></div>
      </div>

      <div class="summary-stats">
        <div class="stat-card pass">
          <span class="stat-num">${counts.pass}</span>
          <span class="stat-label">Pass</span>
        </div>
        <div class="stat-card fail">
          <span class="stat-num">${counts.fail}</span>
          <span class="stat-label">Fail</span>
        </div>
        <div class="stat-card">
          <span class="stat-num">${counts.na + counts.pending}</span>
          <span class="stat-label">N/A · Skipped</span>
        </div>
      </div>

      ${fails.length ? `
        <div class="callout danger">
          <span class="callout-label">Defects — ${fails.length} item${fails.length === 1 ? '' : 's'}</span>
          <ul style="margin:6px 0 0 0; padding-left:18px">
            ${fails.map(f => `<li style="margin-bottom:6px"><strong>${f.item.title}</strong>${f.note ? `<br><em style="color:var(--text-muted)">${escapeHtml(f.note)}</em>` : ''}</li>`).join('')}
          </ul>
        </div>
      ` : counts.pending === 0 ? `
        <div class="callout">
          <span class="callout-label">No defects</span>
          All ${totalItems} items inspected. Record outcome in site log and issue service documentation.
        </div>
      ` : `
        <div class="callout">
          <span class="callout-label">Incomplete</span>
          ${counts.pending} item${counts.pending === 1 ? '' : 's'} not yet reviewed.
        </div>
      `}

      <div class="bottom-actions">
        <button class="action-btn" id="exportBtn">Export Report (.txt)</button>
        <button class="action-btn" id="backToListBtn">← Back to Checklist</button>
        <button class="action-btn danger" id="newJobBtn">New Job (reset all)</button>
      </div>
    </div>
  `;
}

function countItems(svc) {
  return SERVICE_TYPES[svc].groups.reduce((a, g) => a + g.items.length, 0);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exportText() {
  const m = state.model;
  const service = SERVICE_TYPES[state.service];
  const date = new Date().toLocaleString('en-GB');
  const lines = [];
  lines.push(`HOISTREF — SERVICE REPORT`);
  lines.push(`${'='.repeat(50)}`);
  lines.push(`Date: ${date}`);
  lines.push(`Hoist: ${m} / ${state.variant.code}`);
  lines.push(`SWL: ${state.variant.swl}`);
  if (state.serial) lines.push(`Serial: ${state.serial}`);
  if (state.siteRef) lines.push(`Site: ${state.siteRef}`);
  lines.push(`Service: ${service.label}`);
  lines.push('');

  service.groups.forEach(g => {
    lines.push(`[${g.title.toUpperCase()}]`);
    g.items.forEach(item => {
      const r = state.results[item.id] || {};
      const status = (r.status || 'PENDING').toUpperCase();
      lines.push(`  ${status.padEnd(8)}  ${item.title}`);
      if (r.note) lines.push(`            NOTE: ${r.note}`);
    });
    lines.push('');
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = `${m}_${state.variant.code.replace(/[^A-Z0-9]/gi,'')}_${state.service}_${new Date().toISOString().slice(0,10)}.txt`;
  a.download = safeName;
  a.click();
  URL.revokeObjectURL(url);
}

function attachHandlers() {
  document.getElementById('backBtn').onclick = () => {
    const flow = ['model', 'variant', 'service', 'job', 'checklist', 'summary'];
    const i = flow.indexOf(state.screen);
    if (i > 0) go(flow[i - 1]);
  };

  document.querySelectorAll('[data-model]').forEach(el => {
    el.onclick = () => go('variant', { model: el.dataset.model, variant: null, service: null, results: {} });
  });

  document.querySelectorAll('[data-variant]').forEach(el => {
    el.onclick = () => {
      const v = VARIANTS[state.model][parseInt(el.dataset.variant)];
      go('service', { variant: v, service: null, results: {} });
    };
  });

  document.querySelectorAll('[data-service]').forEach(el => {
    el.onclick = () => go('job', { service: el.dataset.service, results: {} });
  });

  const startBtn = document.getElementById('startBtn');
  if (startBtn) {
    startBtn.onclick = () => {
      state.serial = document.getElementById('serialInput').value.trim();
      state.siteRef = document.getElementById('siteInput').value.trim();
      go('checklist');
    };
  }

  document.querySelectorAll('[data-mark]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id;
      const mark = el.dataset.mark;
      if (!state.results[id]) state.results[id] = { status: null, note: '' };
      state.results[id].status = state.results[id].status === mark ? null : mark;
      save();
      /* Light re-render: just update the item's class + progress */
      const item = el.closest('.check-item');
      item.classList.remove('done-pass', 'done-fail', 'done-na');
      if (state.results[id].status) item.classList.add(`done-${state.results[id].status}`);
      updateProgress();
    };
  });

  document.querySelectorAll('[data-expand]').forEach(el => {
    el.onclick = () => {
      const target = document.getElementById(el.dataset.expand);
      if (target) {
        target.classList.toggle('open');
        el.textContent = target.classList.contains('open') ? '− Hide details' : '+ Details';
      }
    };
  });

  document.querySelectorAll('[data-diagram]').forEach(el => {
    el.onclick = () => openDiagram(el.dataset.diagram);
  });

  document.querySelectorAll('[data-note]').forEach(el => {
    el.oninput = () => {
      const id = el.dataset.note;
      if (!state.results[id]) state.results[id] = { status: null, note: '' };
      state.results[id].note = el.value;
      save();
    };
  });

  const finishBtn = document.getElementById('finishBtn');
  if (finishBtn) finishBtn.onclick = () => go('summary');

  const backToListBtn = document.getElementById('backToListBtn');
  if (backToListBtn) backToListBtn.onclick = () => go('checklist');

  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = () => {
    if (confirm('Clear all pass/fail results for this job?')) {
      state.results = {};
      save();
      render();
    }
  };

  const newJobBtn = document.getElementById('newJobBtn');
  if (newJobBtn) newJobBtn.onclick = () => {
    if (confirm('Start a completely new job? All current results will be lost.')) {
      resetSession();
    }
  };

  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.onclick = exportText;
}

function updateProgress() {
  if (state.screen !== 'checklist') return;
  const service = SERVICE_TYPES[state.service];
  const totalItems = service.groups.reduce((a, g) => a + g.items.length, 0);
  const doneItems = Object.values(state.results).filter(r => r && r.status).length;
  const pct = Math.round((doneItems / totalItems) * 100);
  const progress = document.querySelector('.progress');
  if (progress) {
    progress.querySelector('span:first-child').textContent = `${doneItems}/${totalItems}`;
    progress.querySelector('span:last-child').textContent = `${pct}%`;
    progress.querySelector('.progress-fill').style.width = `${pct}%`;
  }
}

/* ═══════════════════════════════════════════════════════════════
   DIAGRAM MODAL
   ═══════════════════════════════════════════════════════════════ */

function openDiagram(key) {
  const d = DIAGRAMS[key];
  if (!d) return;
  const m = state.model;
  const overlay = document.getElementById('dgmOverlay');
  const title = document.getElementById('dgmTitle');
  const subtitle = document.getElementById('dgmSubtitle');
  const content = document.getElementById('dgmContent');
  const body = document.getElementById('dgmBody');

  title.textContent = d.title;
  subtitle.textContent = `${m} · ${d.subtitle}`;

  /* SVG content */
  const svg = typeof d.svgFn === 'function' ? d.svgFn(m) : (d.svg || '');
  content.innerHTML = `<div class="diagram">${svg}</div>`;

  /* Body text */
  const bodyText = d.bodyFn ? d.bodyFn(m) : (d.body || '');
  body.innerHTML = bodyText;

  overlay.classList.add('open');
  /* Reset scroll */
  document.getElementById('dgmPanel').scrollTop = 0;
}

function closeDiagram() {
  document.getElementById('dgmOverlay').classList.remove('open');
}

document.getElementById('dgmClose').onclick = closeDiagram;
document.getElementById('dgmOverlay').onclick = (e) => {
  if (e.target.id === 'dgmOverlay') closeDiagram();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDiagram();
});

render();
</script>
